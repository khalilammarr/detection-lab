## Cortex 3 - configuration lab "SOC Lab"
## Monte en /etc/cortex/application.conf + lance avec --no-config

## Secret de session (obligatoire en mode prod) - injecte par la variable CORTEX_SECRET
play.http.secret.key = ${CORTEX_SECRET}

## Elasticsearch (index des jobs/analyses)
search {
  index = cortex
  uri = "http://elasticsearch:9200"
  keepalive = 1m
  pagesize = 50
  nbshards = 1
  nbreplicas = 0
}

## Listes d'analyzers / responders (telecharges a la demande)
analyzer {
  urls = ["https://download.thehive-project.org/analyzers.json"]
}
responder {
  urls = ["https://download.thehive-project.org/responders.json"]
}

## Execution des analyzers via des conteneurs Docker (socket monte)
job {
  runner = [docker]
}
